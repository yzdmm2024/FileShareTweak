name: Build FileShareTweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup Theos
      uses: actions/checkout@v4
      with:
        repository: theos/theos
        path: theos
        ref: master

    - name: Clone theos/sdks (get iPhoneOS16.5.sdk)
      run: |
        rm -rf theos/sdks
        git clone --depth 1 https://github.com/theos/sdks.git theos/sdks
        # Only keep 16.5 to save space
        find theos/sdks -name "*.sdk" ! -name "iPhoneOS16.5.sdk" -type d -exec rm -rf {} +
        ls -la theos/sdks/

    - name: Update Theos (download vendor)
      run: |
        export THEOS=$PWD/theos
        $THEOS/bin/update-theos

    - name: Install dependencies (ldid, dm.pl)
      run: |
        brew install ldid
        npm install -g @theosdev/dm.pl

    - name: Build with Theos
      run: |
        export THEOS=$PWD/theos
        export TARGET=iphone:clang:16.5:14.0
        make clean
        make package FINALPACKAGE=1

    - name: Rename .deb
      run: |
        mv packages/*.deb FileShareTweak.deb || true
        ls -la *.deb

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: FileShareTweak-deb
        path: ./*.deb

    - name: Publish to source repo (yzdmm2024/repo)
      if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      env:
        TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::warning::未配置 SOURCE_REPO_TOKEN secret，跳过自动发布。请在 FileShareTweak 仓库 Settings > Secrets 添加一个对 yzdmm2024/repo 有写权限的 PAT（名为 SOURCE_REPO_TOKEN）。"
          exit 0
        fi
        set -e
        git config --global user.email "actions@github.com"
        git config --global user.name "github-actions[bot]"
        rm -rf _src
        git clone https://x-access-token:${TOKEN}@github.com/yzdmm2024/repo.git _src
        cp FileShareTweak.deb _src/debs/FileShareTweak.deb
        cd _src
        python3 gen_packages.py
        git add debs/FileShareTweak.deb Packages Packages.gz Packages.bz2 Release
        if git diff --cached --quiet; then
          echo "索引无变化，跳过提交"
          exit 0
        fi
        git commit -m "ci(FileShareTweak): 自动更新 deb 与索引 (run ${GITHUB_RUN_NUMBER})"
        git pull --rebase origin main
        git push https://x-access-token:${TOKEN}@github.com/yzdmm2024/repo.git HEAD:main
