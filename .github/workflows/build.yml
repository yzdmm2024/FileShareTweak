name: Build FileShareTweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup Theos
      uses: actions/checkout@v4
      with:
        repository: theos/theos
        path: theos
        ref: master

    - name: Clone theos/sdks (get iPhoneOS16.5.sdk)
      run: |
        rm -rf theos/sdks
        git clone --depth 1 https://github.com/theos/sdks.git theos/sdks
        # Only keep 16.5 to save space
        find theos/sdks -name "*.sdk" ! -name "iPhoneOS16.5.sdk" -type d -exec rm -rf {} +
        ls -la theos/sdks/

    - name: Update Theos (download vendor)
      run: |
        export THEOS=$PWD/theos
        $THEOS/bin/update-theos

    - name: Install dependencies (ldid, dm.pl)
      run: |
        brew install ldid
        npm install -g @theosdev/dm.pl

    - name: Build with Theos
      run: |
        export THEOS=$PWD/theos
        export TARGET=iphone:clang:16.5:14.0
        make clean
        make package FINALPACKAGE=1

    - name: Rename .deb
      run: |
        mv packages/*.deb FileShareTweak.deb || true
        ls -la *.deb

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: FileShareTweak-deb
        path: ./*.deb