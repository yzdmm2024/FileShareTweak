name: Build FileShareTweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        theos-sdk: [16.5]
        
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Theos
      uses: actions/checkout@v4
      with:
        repository: theos/theos
        path: theos
        ref: master

    - name: Download iOS SDK
      run: |
        mkdir -p theos/sdks
        curl -L "https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz" -o iPhoneOS16.5.sdk.tar.xz
        tar -xf iPhoneOS16.5.sdk.tar.xz -C theos/sdks/

    - name: Build Tweak
      run: |
        export THEOS=$PWD/theos
        export TARGET=${{ matrix.theos-sdk }}
        
        # 编译 dylib
        cd FileShareTweak
        make clean
        make package FINALPACKAGE=1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FileShareTweak-deb
        path: FileShareTweak/*.deb